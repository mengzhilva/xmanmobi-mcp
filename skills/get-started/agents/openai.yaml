interface:
  display_name: "Xmanmobi setup"
  short_description: "Connect and start read-only ad analysis"
  brand_color: "#086F83"
  default_prompt: "Use $get-started to connect Xmanmobi and analyze my advertising data."
dependencies:
  tools:
    - type: "mcp"
      value: "xmanmobi"
      description: "Read-only Xmanmobi advertising analytics tools"
      transport: "streamable_http"
      url: "https://ai.xmanmobi.com/mcp"
policy:
  allow_implicit_invocation: true
